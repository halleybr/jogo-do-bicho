name: Atualizar histórico diário

# Roda todo dia às 02:45 UTC = 23:45 no horário de Brasília (UTC-3),
# depois da última apuração do dia (Coruja 21:30). Também pode rodar
# manualmente pela aba Actions → "Run workflow".
on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dias novos (incremental)
        run: python historico.py

      - name: Commit do histórico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/historico.json
          if git diff --cached --quiet; then
            echo "sem mudanças no histórico"
          else
            git commit -m "Atualiza histórico diário [skip ci]"
            git push
          fi
