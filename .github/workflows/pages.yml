name: Deploy no GitHub Pages

# Publica o site como estático no GitHub Pages. Roda:
#   1. a cada push na main (inclui o commit diário do histórico);
#   2. a cada 2 horas (cron em UTC, minutos :45), logo depois das apurações
#      do dia no horário de Brasília — 09:30, 11:30, 14:30, 16:30, 18:30,
#      19:00 (FED) e 21:30 (COR) — para os resultados de hoje irem subindo
#      ao longo do dia (as execuções caem às 21:45, 23:45, 01:45, ... 19:45 BR);
#   3. manualmente pela aba Actions → "Run workflow".
#
# Antes do deploy o build baixa os dias novos (historico.py) e gera os
# JSONs estáticos (gerar_estatico.py) que o frontend usa sem backend.
#
# IMPORTANTE (uma vez): em Settings → Pages, deixe "Source" em
# "GitHub Actions" para este workflow publicar o site.
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dias novos (incremental)
        run: python historico.py

      - name: Gerar JSONs estáticos
        run: python gerar_estatico.py

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy no GitHub Pages
        uses: actions/deploy-pages@v4
