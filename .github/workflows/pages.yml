name: Deploy no GitHub Pages

# Publica o site como estático no GitHub Pages. Roda:
#   1. a cada push na main (inclui o commit diário do histórico);
#   2. no agendamento, 2 minutos depois de cada apuração do dia (horário de
#      Brasília) — 09:30, 11:30, 14:30, 16:30, 18:20, 20:00 e 21:30. Os
#      horários abaixo são em UTC (= BR - 3):
#        - "32 0,12,14,17,19 * * *"  → 09:32, 11:32, 14:32, 16:32 e 21:32 BR
#        - "22 21 * * *"            → 18:22 BR (após a PTN)
#        - "2 23 * * *"             → 20:02 BR (após a FED)
#      (o GitHub pode atrasar a execução em alguns minutos em horários de pico)
#   3. manualmente pela aba Actions → "Run workflow".
#
# Antes do deploy o build baixa os dias novos (historico.py) e gera os
# JSONs estáticos (gerar_estatico.py) que o frontend usa sem backend.
#
# IMPORTANTE (uma vez): em Settings → Pages, deixe "Source" em
# "GitHub Actions" para este workflow publicar o site.
on:
  push:
    branches: [main]
  schedule:
    - cron: "32 0,12,14,17,19 * * *"
    - cron: "22 21 * * *"
    - cron: "2 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar dias novos (incremental)
        run: python historico.py

      - name: Gerar JSONs estáticos
        run: python gerar_estatico.py

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy no GitHub Pages
        uses: actions/deploy-pages@v4
